name: Laravel CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hikepasslaravel
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, bcmath, pdo, mysql
          coverage: none

      # 3. Install dependencies
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      # 4. Copy env
      - name: Copy .env
        run: cp .env.example .env

      # 5. Override env for CI
      - name: Configure environment
        run: |
          php -r "file_put_contents('.env', preg_replace('/DB_HOST=.*/', 'DB_HOST=127.0.0.1', file_get_contents('.env')));"
          php -r "file_put_contents('.env', preg_replace('/DB_DATABASE=.*/', 'DB_DATABASE=hikepasslaravel', file_get_contents('.env')));"
          php -r "file_put_contents('.env', preg_replace('/DB_USERNAME=.*/', 'DB_USERNAME=root', file_get_contents('.env')));"
          php -r "file_put_contents('.env', preg_replace('/DB_PASSWORD=.*/', 'DB_PASSWORD=root', file_get_contents('.env')));"
          php -r "file_put_contents('.env', preg_replace('/SESSION_DRIVER=.*/', 'SESSION_DRIVER=file', file_get_contents('.env')));"
          php -r "file_put_contents('.env', preg_replace('/CACHE_STORE=.*/', 'CACHE_STORE=file', file_get_contents('.env')));"
          php -r "file_put_contents('.env', preg_replace('/QUEUE_CONNECTION=.*/', 'QUEUE_CONNECTION=sync', file_get_contents('.env')));"

      # 6. Generate key
      - name: Generate key
        run: php artisan key:generate

      # 7. Permission
      - name: Set permission
        run: chmod -R 777 storage bootstrap/cache

      # 8. Migrate
      - name: Run migrations
        run: php artisan migrate --force

      # 9. Test
      - name: Run tests
        run: php artisan test
        
      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
            projectBaseDir: .
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
